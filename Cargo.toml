[workspace]
resolver = "3"
members = [
    "crates/daguerreo",
    "crates/sl-binding",
    "crates/sl-core",
    "crates/sl-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
daguerreo = { path = "./crates/daguerreo/" }
sl-core = { path = "./crates/sl-core/" }
sl-macros = { path = "./crates/sl-macros/" }

anyhow = "1.0.100"
async-trait = "0.1.89"
bitflags = "2.10.0"
console_error_panic_hook = "0.1.7"
dashmap = "6.1.0"
getrandom = "*"
nanoid = "0.4.0"
parking_lot = "0.12.5"
quote = "1.0.43"
serde = "1.0.228"
syn = "2.0.114"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-wasm = "0.2.1"
tsify = "0.5.6"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.58"
web-sys = "0.3.83"

[profile.release]
opt-level = "s"
debug = "none"
strip = true
lto = true
